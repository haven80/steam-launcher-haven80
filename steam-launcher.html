/* Layout: full-bleed WebGL strip of covers; quiet type in the corners; detail view splits hero | panel. Dark first, light mirrors it. */
:root {
  --ink: #0c0d0f;
  --panel: #16181b;
  --paper: #ece7df;
  --mute: #8c8a86;
  --line: rgba(236, 231, 223, .12);
  --game-raw: #d9a35b;
  --game: var(--game-raw);
  --on-game: #0c0d0f;
  --good: #6cc47a; --mid: #e3b744; --bad: #e46a55;
  --f-display: "Bricolage Grotesque", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --f-body: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ink: #edecea; --panel: #f8f7f5; --paper: #131416; --mute: #6b6a67; --line: rgba(19, 20, 22, .13);
    --game: color-mix(in srgb, var(--game-raw) 58%, #000); --on-game: #f6f5f3; color-scheme: light;
    --good: #2f8f45; --mid: #a87b0c; --bad: #b9412f;
  }
}
:root[data-theme="light"] {
  --ink: #edecea; --panel: #f8f7f5; --paper: #131416; --mute: #6b6a67; --line: rgba(19, 20, 22, .13);
  --game: color-mix(in srgb, var(--game-raw) 58%, #000); --on-game: #f6f5f3; color-scheme: light;
  --good: #2f8f45; --mid: #a87b0c; --bad: #b9412f;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--paper); margin: 0;
  font-family: var(--f-body); font-size: 15px; overflow: hidden;
  -webkit-font-smoothing: antialiased; user-select: none;
  transition: background-color .4s, color .4s;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#gl.dragging { cursor: grabbing; }
#gl.pointer { cursor: pointer; }

.ui { position: fixed; inset: 0; pointer-events: none; padding: max(20px, env(safe-area-inset-top, 0px)) 32px max(24px, env(safe-area-inset-bottom, 0px)); }
.top, .detail, .settings { pointer-events: auto; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.left { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; min-width: 0; }
.brand { font-family: var(--f-display); font-weight: 500; font-size: 15px; letter-spacing: .01em; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
.brand small { font-family: var(--f-mono); font-size: 11px; color: var(--mute); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.sample { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--mute); border: 1px solid var(--line); padding: 3px 7px; border-radius: 99px; }

.search { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding: 4px 2px; width: min(260px, 52vw); transition: border-color .25s; }
.search:focus-within, .search.has-q { border-color: var(--paper); }
.search svg { flex: none; width: 14px; height: 14px; stroke: var(--mute); }
.search input { all: unset; flex: 1; min-width: 0; font: 400 13px var(--f-body); color: var(--paper); user-select: text; }
.search input::placeholder { color: var(--mute); }
.search .count { font: 400 11px var(--f-mono); color: var(--mute); font-variant-numeric: tabular-nums; white-space: nowrap; }
.search .clear { all: unset; cursor: pointer; color: var(--mute); font: 400 14px var(--f-mono); padding: 0 2px; }
.search .clear:hover { color: var(--paper); }

.right { display: flex; align-items: center; gap: 8px; }
.seg { display: flex; gap: 4px; }
.seg button {
  font: 500 12px var(--f-mono); color: var(--mute); background: none; border: 0;
  padding: 6px 10px; border-radius: 99px; cursor: pointer; letter-spacing: .03em; transition: color .25s, background .25s;
}
.seg button:hover { color: var(--paper); }
.seg button[aria-pressed="true"] { color: var(--ink); background: var(--paper); }
.gear { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 99px; color: var(--mute); transition: color .25s, background .25s; }
.gear:hover, .gear[aria-expanded="true"] { color: var(--paper); background: var(--line); }
.gear svg { width: 16px; height: 16px; }
button:focus-visible, .gear:focus-visible { outline: 2px solid var(--game); outline-offset: 2px; }

.settings { position: absolute; top: 62px; right: 32px; width: min(320px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .45); }
.settings h4 { margin: 0 0 8px; font: 400 10px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--mute); }
.settings .seg { flex-wrap: wrap; border: 1px solid var(--line); border-radius: 99px; padding: 3px; width: fit-content; }
.settings p { margin: 0; font-size: 12.5px; color: var(--mute); line-height: 1.45; }
.fx { display: grid; grid-template-columns: auto minmax(0, 1fr) 40px; align-items: center; gap: 10px 12px; }
.fx label { font-size: 13px; }
.fx output { font: 400 11px var(--f-mono); color: var(--mute); text-align: right; font-variant-numeric: tabular-nums; }
.fx input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: none; cursor: pointer; }
.fx input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(to right, var(--paper) var(--fill, 50%), var(--line) var(--fill, 50%)); border-radius: 2px; }
.fx input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; border-radius: 50%; background: var(--paper); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
.fx input[type=range]::-moz-range-track { height: 2px; background: var(--line); }
.fx input[type=range]::-moz-range-progress { height: 2px; background: var(--paper); }
.fx input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--paper); border: 0; }
.fx input[type=range]:focus-visible { outline: 2px solid var(--game); outline-offset: 2px; border-radius: 4px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.cases-only[aria-disabled="true"] { opacity: .4; cursor: default; }
.app-rows { display: flex; flex-direction: column; }
.app-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.app-row:last-child { border-bottom: 0; }
.switch { all: unset; cursor: pointer; flex: none; width: 34px; height: 20px; border-radius: 99px; background: var(--line); position: relative; transition: background .25s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--mute); transition: transform .25s, background .25s; }
.switch[aria-checked="true"] { background: var(--paper); }
.switch[aria-checked="true"]::after { transform: translateX(14px); background: var(--ink); }
.switch:focus-visible, .keycap:focus-visible, .field:focus-visible { outline: 2px solid var(--game); outline-offset: 2px; }
.keycap { all: unset; cursor: pointer; font: 500 12px var(--f-mono); padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; white-space: nowrap; }
.keycap.listening { border-color: var(--game); color: var(--game); }
.app-row .seg { border: 1px solid var(--line); border-radius: 99px; padding: 2px; }
.app-row .seg button { padding: 4px 9px; font-size: 11px; }
.igdb { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }

// ---------- game cases
// A box: front (the cover under a plastic sleeve), spine on the left with the
// title, and a moulded shell for the other faces. Its thickness shrinks to
// zero when it opens, so it turns into the flat hero of the detail view.
const BOX = (() => {
  const pos = [], uv = [], nrm = [], face = [], idx = [];
  const quad = (corners, n, f) => {
    const b = pos.length / 3;
    const uvs = [[0, 0], [1, 0], [1, 1], [0, 1]];
    corners.forEach((c, k) => { pos.push(...c); uv.push(...uvs[k]); nrm.push(...n); face.push(f); });
    idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
  };
  const h = .5;
  quad([[-h, -h, h], [h, -h, h], [h, h, h], [-h, h, h]], [0, 0, 1], 0);       // front
  quad([[-h, -h, -h], [-h, -h, h], [-h, h, h], [-h, h, -h]], [-1, 0, 0], 1);  // spine
  quad([[h, -h, h], [h, -h, -h], [h, h, -h], [h, h, h]], [1, 0, 0], 2);       // opening edge
  quad([[h, -h, -h], [-h, -h, -h], [-h, h, -h], [h, h, -h]], [0, 0, -1], 3);  // back
  quad([[-h, h, h], [h, h, h], [h, h, -h], [-h, h, -h]], [0, 1, 0], 2);       // top
  quad([[-h, -h, -h], [h, -h, -h], [h, -h, h], [-h, -h, h]], [0, -1, 0], 2);  // bottom
  return { pos: buffer(new Float32Array(pos)), uv: buffer(new Float32Array(uv)), nrm: buffer(new Float32Array(nrm)),
           face: buffer(new Float32Array(face)), idx: buffer(new Uint16Array(idx), gl.ELEMENT_ARRAY_BUFFER), count: idx.length };
})();

// The spine: the game's colour with its title running down it.
function drawSpine(g, shell) {
  const c = document.createElement("canvas"); c.width = 80; c.height = 900;
  const x = c.getContext("2d");
  x.fillStyle = shell; x.fillRect(0, 0, 80, 900);
  const lg = x.createLinearGradient(0, 0, 80, 0);
  lg.addColorStop(0, "rgba(0,0,0,.25)"); lg.addColorStop(.45, "rgba(255,255,255,.08)"); lg.addColorStop(1, "rgba(0,0,0,.3)");
  x.fillStyle = lg; x.fillRect(0, 0, 80, 900);
  x.fillStyle = g.accent; x.globalAlpha = .9; x.fillRect(0, 0, 80, 58); x.globalAlpha = 1;
  if (fx.caseLogo && !g.divider) {
    // the band of the front wraps round the spine
    const bg = x.createLinearGradient(0, 0, 80, 0); bg.addColorStop(0, "#0b0b0d"); bg.addColorStop(.5, "#1c1d21"); bg.addColorStop(1, "#0b0b0d");
    x.fillStyle = bg; x.fillRect(0, 0, 80, 58);
    x.fillStyle = "rgba(210,212,218,.8)"; x.fillRect(0, 57, 80, 2);
  }
  x.save();
  x.translate(40, 92); x.rotate(Math.PI / 2);
  x.fillStyle = "#f4f1ea"; x.textBaseline = "middle";
  x.font = '600 34px "Bricolage Grotesque", "Segoe UI", sans-serif';
  let name = g.name;
  const max = 900 - 92 - 36;
  if (x.measureText(name).width > max) {
    while (name.length > 1 && x.measureText(name + "…").width > max) name = name.slice(0, -1);
    name = name.trimEnd() + "…";
  }
  x.fillText(name, 0, 0);
  x.restore();
  return c;
}
// Dark plastic tinted with the game's colour.
function shellColor(accent, out) {
  const a = rgb(accent);
  for (let k = 0; k < 3; k++) out[k] = a[k] * 0.32 + 0.035;
  return `rgb(${Math.round(out[0] * 255)}, ${Math.round(out[1] * 255)}, ${Math.round(out[2] * 255)})`;
}
function makeSpine(it) {
  if (it.spine) gl.deleteTexture(it.spine);
  it.spine = makeTex(drawSpine(it.g, shellColor(it.g.accent, it.u.uShell)));
  it.u.uSpine.value = it.spine;
}

// Cover Flow layout for a case at signed distance d (in slots) from the centre.
function caseLayout(d, it) {
  const A = Math.min(fx.curve / 100, 1.4) * 1.08;  // up to ~87 degrees
  const ca = Math.cos(A), t = Math.max(-1, Math.min(1, d));
  const centerGap = W * (0.62 + 0.5 * ca), side = W * (0.25 + 0.85 * ca);
  it.pos.x = t * centerGap + (d - t) * side;
  it.pos.y = STRIP_Y;
  it.pos.z = (1 - Math.abs(t)) * (30 + 60 * Math.sin(A));
  it.rot.y = -t * A + it.lean.y + it.flip;
  it.rot.x = it.lean.x;
  it.scl.x = W * CASE_SCALE; it.scl.y = H * CASE_SCALE;
  return it.pos.x;
}
const CASE_SCALE = 0.9;

// A sample year for the browser preview: made-up sessions over a few months.
function sampleHistory(games) {
  const today = new Date(), todayN = dateYmd(today);
  const start = new Date(today.getFullYear(), Math.max(0, today.getMonth() - 7), 14);
  const sinceN = dateYmd(start);
  const rows = [], tot = new Map(), last = new Map();
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const played = games.filter(g => g.min > 0);
  played.forEach(g => {
    const m = Math.max(10, Math.round(g.min * 0.55));
    tot.set(g.id, m);
    // Hollow Knight sat untouched for over a year, to show "picked up again"
    last.set(g.id, g.id === 367520 ? Math.round(start.getTime() / 1000) - 430 * 86400 : Math.round(start.getTime() / 1000) - Math.round(rnd() * 40) * 86400);
    rows.push([sinceN, g.id, m, last.get(g.id)]);
  });
  for (let d = new Date(start.getTime() + DAY); dateYmd(d) <= todayN; d = new Date(d.getTime() + DAY)) {
    if (rnd() > 0.58) continue;
    const recent = (today - d) / DAY < 25;
    const n = rnd() > 0.75 ? 2 : 1;
    for (let k = 0; k < n; k++) {
      let g = played[Math.floor(rnd() * Math.min(played.length, 6))];
      if (recent && rnd() > 0.6) g = played.find(x => x.id === 367520) || g;
      if (!recent && g.id === 367520) continue;
      const add = 25 + Math.round(rnd() * 200);
      const m = tot.get(g.id) + add;
      rows.push([dateYmd(d), g.id, m, last.get(g.id)]);
      tot.set(g.id, m); last.set(g.id, Math.round(d.getTime() / 1000) + 20 * 3600);
    }
  }
  return { since: sinceN, today: todayN, rows };
}

  postU.uFloor.value = 0.5 + (STRIP_Y - H / 2 - 6) / VH;
  postU.uReflect.value += ((fx.reflect && mode === "list" && n && !cases ? 1 : 0) - postU.uReflect.value) * L(0.08);
  caseReflect += ((fx.reflect && mode === "list" && n ? 1 : 0) - caseReflect) * L(0.08);
  dustU.uScroll.value = scroll;
  updateParallax(L);
  romMix += ((fx.caseLogo ? 1 : 0) - romMix) * L(0.08);
  dustU.uAlpha.value += ((mode === "list" ? 1 : 0.35) - dustU.uAlpha.value) * L(0.05);
  // light rays: from behind the centred game, or the picture in the detail view
  raysU.uPower.value += ((fx.rays && n && !reduced ? (mode === "list" ? 1 : mode === "wall" ? 0.25 : 0.7) : 0) * (1 - wm * 0.7) - raysU.uPower.value) * L(0.05);
  raysU.uCenter.set(glowU.uCenter.value.x, glowU.uCenter.value.y + (mode === "list" ? 0.04 : 0));
  {
    const r = mode === "list" || mode === "wall" ? null : heroRect();
    const hx = r ? r.w / 2 / VH : W * (cases ? CASE_SCALE : 1) / 2 / VH, hy = r ? r.h / 2 / VH : H * (cases ? CASE_SCALE : 1) / 2 / VH;
    raysU.uHole.set(raysU.uHole.x + (hx - raysU.uHole.x) * L(0.08), raysU.uHole.y + (hy - raysU.uHole.y) * L(0.08));
  }
  raysU.uLight.value = LIGHT;
  dustU.uRayC.set(raysU.uCenter.x, raysU.uCenter.y);
  dustU.uRayPow.value = fx.dust ? raysU.uPower.value : 0;
  // living backdrop
  amb.power += ((fx.ambient && n ? 1 : 0) - amb.power) * L(0.04);
  updateAmbient(now, mode === "detail" || mode === "closing" ? list[activeIdx] : list[hi]);
  // water: a ring each time the strip settles on a game
  postU.uWater.value += ((fx.water && mode === "list" ? 1 : 0) - postU.uWater.value) * L(0.06);
  postU.uWaterFloor.value = floorUv();
  if (mode === "list" && n && cur !== lastLanded && Math.abs(target - scroll) < STEP * 0.03) { if (lastLanded >= 0) addRipple(0.5, 0.8); lastLanded = cur; }
  shadowMix += ((fx.shadows && n ? 1 : 0) * (1 - wm) - shadowMix) * L(0.08);

  // pass 1: the scene, into the off-screen target
  gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fbo);
  gl.viewport(0, 0, rt.w, rt.h);
  gl.clearColor(BG[0], BG[1], BG[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  if (amb.power > 0.005 && amb.b !== blank) {
    use(ambProg, [["position", QUAD.pos, 3], ["uv", QUAD.uv, 2]]);
    setUniforms(ambProg, { uA: amb.a === blank ? amb.b : amb.a, uB: amb.b, uMix: amb.mix, uRes: glowU.uRes, uTime: TIME, uPower: amb.power, uLight: LIGHT, uBg: BG });
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, QUAD.idx);
    gl.drawElements(gl.TRIANGLES, QUAD.count, gl.UNSIGNED_SHORT, 0);
  }
  if (fx.glow) {
    use(glowProg, [["position", QUAD.pos, 3], ["uv", QUAD.uv, 2]]);
    setUniforms(glowProg, glowU);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, QUAD.idx);
    gl.drawElements(gl.TRIANGLES, QUAD.count, gl.UNSIGNED_SHORT, 0);
  }
  if (raysU.uPower.value > 0.005) {
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    use(raysProg, [["position", QUAD.pos, 3], ["uv", QUAD.uv, 2]]);
    setUniforms(raysProg, raysU);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, QUAD.idx);
    gl.drawElements(gl.TRIANGLES, QUAD.count, gl.UNSIGNED_SHORT, 0);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  }
  if (fx.dust && !reduced) {
    use(dustProg, [["position", dustBuf.pos, 3], ["seed", dustBuf.seed, 1]]);
    setUniforms(dustProg, dustU);
    gl.drawArrays(gl.POINTS, 0, DUST);
  }
  // the opened cover is drawn last, over its fading neighbours
  const order = list.filter(it => it.visible);
  if (cases) order.sort((a, b) => b.sort - a.sort);
  if (mode !== "list" && list[activeIdx] && order.includes(list[activeIdx])) { order.splice(order.indexOf(list[activeIdx]), 1); order.push(list[activeIdx]); }
  const act = mode === "detail" || mode === "closing" ? list[activeIdx] : null;
  updateTrailer(act);
  const floorY = STRIP_Y - (cases ? H * CASE_SCALE / 2 : H / 2 + 6);
  const drawShadows = () => {
    if (shadowMix < 0.01) return;
    use(shadowProg, [["position", QUAD.pos, 3], ["uv", QUAD.uv, 2]]);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, QUAD.idx);
    setUniforms(shadowProg, { viewMatrix: VIEW, projectionMatrix: PROJ, uLight: LIGHT });
    for (const it of order) {
      if (it === act && mode !== "list") continue;  // the opened game no longer stands on the floor
      const intro = it.u.uIntro.value;
      const a = shadowMix * it.u.uAlpha.value * intro * intro * (it.g.installed ? 1 : 0.6);
      if (a < 0.01) continue;
      gl.uniformMatrix4fv(shadowProg.u("modelMatrix"), false, shadowMatrix(it, floorY, MODEL));
      gl.uniform1f(shadowProg.u("uAlpha"), a);
      gl.drawElements(gl.TRIANGLES, QUAD.count, gl.UNSIGNED_SHORT, 0);
    }
  };
  const drawShelves = () => {
    if (wm < 0.01) return;
    use(shelfProg, [["position", GRID.pos, 3], ["uv", GRID.uv, 2]]);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, GRID.idx);
    const col = [BG[0] * (1 - LIGHT * 0.12) + 0.06 + LIGHT * -0.02, BG[1] * (1 - LIGHT * 0.12) + 0.06 + LIGHT * -0.02, BG[2] * (1 - LIGHT * 0.12) + 0.065 + LIGHT * -0.02];
    setUniforms(shelfProg, { viewMatrix: VIEW, projectionMatrix: PROJ, uViewW: VW, uCurve: cases ? 0 : CURVE.value, uColor: col, uAlpha: wm });
    const span = VW * 2.4, depth = wall.w * (cases ? 0.75 : 0.45);
    for (let r = 0; r < wall.rows; r++) {
      const y = wall.top - r * wall.rowStep - wall.h / 2 - 3;
      // the top of the shelf, lying flat, then its front edge
      gl.uniform1f(shelfProg.u("uTop"), 1);
      gl.uniformMatrix4fv(shelfProg.u("modelMatrix"), false, new Float32Array([span, 0, 0, 0, 0, 0, -depth, 0, 0, 1, 0, 0, 0, y, depth * 0.1, 1]));
      gl.drawElements(gl.TRIANGLES, GRID.count, gl.UNSIGNED_SHORT, 0);
      gl.uniform1f(shelfProg.u("uTop"), 0);
      gl.uniformMatrix4fv(shelfProg.u("modelMatrix"), false, new Float32Array([span, 0, 0, 0, 0, 7, 0, 0, 0, 0, 1, 0, 0, y - 3.5, depth * 0.6, 1]));
      gl.drawElements(gl.TRIANGLES, GRID.count, gl.UNSIGNED_SHORT, 0);
    }
  };
  if (cases && act && backdrop.mix.value > 0.01) {
    // behind an opened case: its big picture, dimmed
    use(coverProg, [["position", GRID.pos, 3], ["uv", GRID.uv, 2]]);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, GRID.idx);
    setUniforms(coverProg, { viewMatrix: VIEW, projectionMatrix: PROJ, uViewW: VW, uBg: BG, uTime: TIME, uCurve: CURVE, uPx: DPR, uPointer: ptrE, uPar: PAR, uParZ: PARZ });
    gl.uniformMatrix4fv(coverProg.u("modelMatrix"), false, modelMatrix(backdrop, MODEL));
    setUniforms(coverProg, {
      uTex: act.u.uTex2.value, uTex2: act.u.uTex2.value, uImg: act.u.uImg2.value, uImg2: act.u.uImg2.value, uMix: 0,
      uVel: 0, uFlat: 1, uIntro: 1, uAlpha: backdrop.mix.value, uActive: 1, uHover: 0, uLight: LIGHT, uGhost: 1.2,
      uWave: 0, uPlane: { value: v2(backdrop.scl.x, backdrop.scl.y) }, uHolo: 0, uTilt: 0,
      uVid: act.u.uVid.value, uVidMix: act.u.uVidMix.value, uImgV: act.u.uImgV.value,
    });
    // the trailer plays in the backdrop, brighter than the still picture
    gl.uniform1f(coverProg.u("uGhost"), 1.2 - 0.75 * act.u.uVidMix.value);
    gl.drawElements(gl.TRIANGLES, GRID.count, gl.UNSIGNED_SHORT, 0);
  }
  if (cases) {
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    use(caseProg, [["position", BOX.pos, 3], ["uv", BOX.uv, 2], ["normal", BOX.nrm, 3], ["face", BOX.face, 1]]);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, BOX.idx);
    const caseUnit = setUniforms(caseProg, { viewMatrix: VIEW, projectionMatrix: PROJ, uBg: BG, uPx: DPR, uFloor: STRIP_Y - H * CASE_SCALE / 2, uH: H * CASE_SCALE, uReflect: caseReflect, uPointer: ptrE, uTime: TIME,
                                              uPar: PAR, uParZ: PARZ, uRomTex: romTex, uInner: trayTex || blank, uThin: 0 });
    const bindCases = () => {
      use(caseProg, [["position", BOX.pos, 3], ["uv", BOX.uv, 2], ["normal", BOX.nrm, 3], ["face", BOX.face, 1]]);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, BOX.idx);
      return setUniforms(caseProg, { viewMatrix: VIEW, projectionMatrix: PROJ, uBg: BG, uPx: DPR, uFloor: STRIP_Y - H * CASE_SCALE / 2, uH: H * CASE_SCALE, uReflect: caseReflect, uPointer: ptrE, uTime: TIME,
                                     uPar: PAR, uParZ: PARZ, uRomTex: romTex, uInner: trayTex || blank, uThin: 0 });
    };
    const casePass = (mirror, unit) => {
      gl.uniform1f(caseProg.u("uMirror"), mirror);
      for (const it of order) {
        if (mirror && it.u.uDepth.value < 1) continue;
        // cases fading out don't hide the ones behind them
        gl.depthMask(it.u.uAlpha.value > 0.98 && !launch.active);
        gl.uniformMatrix4fv(caseProg.u("modelMatrix"), false, modelMatrix(it, MODEL));
        setUniforms(caseProg, it.u, unit);
        gl.uniform1f(caseProg.u("uOpen"), it === act && it.openA.value > 0.002 ? 1 : 0);
        gl.drawElements(gl.TRIANGLES, BOX.count, gl.UNSIGNED_SHORT, 0);
      }
    };
    // reflections first, mirrored under the floor
    if (caseReflect > 0.01) casePass(1, caseUnit);
    gl.depthMask(true);
    // reflections lie under the floor: they never hide a real case
    gl.clear(gl.DEPTH_BUFFER_BIT);
    // shadows and shelves lie under the cases
    gl.disable(gl.DEPTH_TEST);
    drawShadows();
    gl.enable(gl.DEPTH_TEST);
    drawShelves();
    const unit = bindCases();
    casePass(0, unit);
    // the lid of the open case, booklet on its inside
    if (act && act.openA.value > 0.002) {
      const un = setUniforms(caseProg, act.u, unit);
      setUniforms(caseProg, { uBack: act.booklet || blank, uBackOn: 1, uDepth: 3, uThin: 1, uOpen: 0, uAlpha: act.u.uAlpha.value }, un);
      gl.uniformMatrix4fv(caseProg.u("modelMatrix"), false, doorMatrix(act, act.openA.value * 2.85, 3, MODEL));
      gl.drawElements(gl.TRIANGLES, BOX.count, gl.UNSIGNED_SHORT, 0);
      gl.uniform1f(caseProg.u("uThin"), 0);
    }
    gl.depthMask(true);
    // the disc, inside the case until it slides out (or lying in the open tray)
    const inTray = act && act.openA.value > 0.02;
    if (act && (act.discOut.value > 0.001 || inTray) && act.texA && act.u.uAlpha.value > 0.01) {
      use(discProg, [["position", DISC.pos, 3], ["uv", DISC.uv, 2]]);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, DISC.idx);
      setUniforms(discProg, {
        viewMatrix: VIEW, projectionMatrix: PROJ,
        modelMatrix: discMatrix(act, act.discOut.value * act.scl.x * (inTray ? 0.6 : 0.66), act.spin, act.scl.x * 0.92, MODEL,
                                inTray ? Math.max(act.u.uDepth.value, 0.6) / 2 + 1.2 : 0),
        uTex: act.texA, uImg: act.u.uImg.value, uSpin: act.spin, uAlpha: act.u.uAlpha.value, uPointer: ptrE, uLight: LIGHT,
      });
      gl.drawElements(gl.TRIANGLES, DISC.count, gl.UNSIGNED_SHORT, 0);
    }
    gl.disable(gl.DEPTH_TEST);
  } else {
    drawShadows();
    drawShelves();
    use(coverProg, [["position", GRID.pos, 3], ["uv", GRID.uv, 2]]);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, GRID.idx);
    setUniforms(coverProg, { viewMatrix: VIEW, projectionMatrix: PROJ, uViewW: VW, uBg: BG, uTime: TIME, uCurve: CURVE, uPx: DPR, uPointer: ptrE, uPar: PAR, uParZ: PARZ });
    for (const it of order) {
      gl.uniformMatrix4fv(coverProg.u("modelMatrix"), false, modelMatrix(it, MODEL));
      setUniforms(coverProg, it.u);
      gl.drawElements(gl.TRIANGLES, GRID.count, gl.UNSIGNED_SHORT, 0);
    }
  }

  // the launch specks
  if (launch.active && launch.prog.value > 0) {
    use(launchProg, [["position", launchBuf, 3]]);
    setUniforms(launchProg, { viewMatrix: VIEW, projectionMatrix: PROJ, modelMatrix: launch.model, uProg: launch.prog, uSink: [glowU.uCenter.value.x * VW - VW / 2, glowU.uCenter.value.y * VH - VH / 2, -700],
                              uSize: Math.max(launch.plane.x / LAUNCH_W, launch.plane.y / LAUNCH_H) * 1.25, uPx: DPR, uTex: launch.tex, uPlane: launch.plane, uImg: launch.img });
    gl.drawArrays(gl.POINTS, 0, LAUNCH_W * LAUNCH_H);
  }

  // pass 2: through the lens, onto the screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.disable(gl.BLEND);
  use(postProg, [["position", QUAD.pos, 3], ["uv", QUAD.uv, 2]]);
  setUniforms(postProg, postU);
  gl.uniform4fv(postProg.u("uRip"), ripples);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, QUAD.idx);
  gl.drawElements(gl.TRIANGLES, QUAD.count, gl.UNSIGNED_SHORT, 0);

  requestAnimationFrame(frame);
}

// Placeholders are drawn before the fonts are ready: redraw them once they are.
function redrawPlaceholders() {
  items.forEach(it => {
    if (it.state === "ready" && it.placeholder) updateTex(it.texA, artFor(it));
    if (it.state === "ready") makeSpine(it);
  });
  dividers.forEach(it => { if (it.state === "ready") { updateTex(it.texA, artFor(it)); makeSpine(it); } });
}

addEventListener("resize", resize);
// In the launcher the mod sends the theme with the library. In a browser, a
// saved choice applies; "System" leaves the host page's own theme alone.
markSeg("data-theme-pref", themePref);
if (!host && themePref !== "auto") setThemePref(themePref, false);
applyTheme();
resize();
document.fonts.ready.then(() => { redrawPlaceholders(); if (romDrawn) drawRomBand(); });
renderCollections();
applyFeatures();
if (host) {
  send({ type: "ready" });
} else {
  $("sample").hidden = false;
  const sample = sampleLibrary();
  historyData = sampleHistory(sample);
  collections = [{ id: "uc-rogue", name: "Roguelike", ids: [1145350, 367520, 504230, 105600] }, { id: "favorite", name: "", ids: [620, 753640, 632470] }];
  renderCollections();
  buildItems(sample);
  intro();
  // sample logos, drawn once the title font is ready (the real ones come from Steam)
  document.fonts.ready.then(() => {
    items.forEach(it => { it.g.logo = sampleLogo(it.g); it.logoImg = null; it.logoReady = false; });
    if (list[activeIdx]) ensureLogo(list[activeIdx]);
  });
}
requestAnimationFrame(frame);
})();
</script>
