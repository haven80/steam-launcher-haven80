# Builds SteamLauncher.exe and the Windhawk mod.
#
# - Every push and pull request: builds both, attached to the run as "steam-launcher".
# - Every release: when you publish a release on GitHub (tag like v1.0.4), or push
#   such a tag, the exe, the mod and their checksums are attached to that release.
#
# The tag must match kVersion in standalone/host.cpp (v1.0.4 <-> L"1.0.4"),
# so the exe's properties always show the released version.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(grep -oP 'kVersion\[\] = L"\K[0-9.]+' standalone/host.cpp)
          echo "tag $tag, kVersion $code"
          if [ "$tag" != "$code" ]; then
            echo "::error::The tag v$tag doesn't match kVersion \"$code\" in standalone/host.cpp. Update kVersion, commit, and tag again."
            exit 1
          fi

      - name: Build the program and the mod
        run: python3 build.py

      - name: Checksums
        run: cd out && sha256sum SteamLauncher.exe steam-launcher.wh.cpp > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: steam-launcher
          path: |
            out/SteamLauncher.exe
            out/steam-launcher.wh.cpp
            out/SHA256SUMS.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/SteamLauncher.exe
            out/steam-launcher.wh.cpp
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
